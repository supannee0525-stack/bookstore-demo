<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — ร้านหนังสือมือสอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#080c15;
  --panel:rgba(15, 23, 42, 0.75);
  --panel-2:rgba(30, 41, 59, 0.6);
  --ink:#f8fafc;
  --muted:#94a3b8;
  --line:rgba(255, 255, 255, 0.08);
  --accent:#3b82f6;
  --accent-2:#60a5fa;
  --accent-ink:#fff;
  --accent-grad:linear-gradient(135deg, #2563eb, #38bdf8);
  --accent-glow:rgba(59, 130, 246, 0.25);
  --danger:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background-color:var(--ground);
  background-image:
    radial-gradient(1000px 500px at 50% -50px, rgba(59, 130, 246, 0.15), transparent 80%),
    radial-gradient(800px 400px at 85% 30%, rgba(99, 102, 241, 0.07), transparent 70%),
    radial-gradient(600px 300px at 15% 60%, rgba(14, 165, 233, 0.06), transparent 70%);
  color:var(--ink);
  font-family:'Plus Jakarta Sans','IBM Plex Sans Thai','Kanit',system-ui,sans-serif;
  display:grid;place-items:center;padding:24px;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:100%;max-width:390px;
  background:var(--panel);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.09);border-radius:24px;
  padding:36px 28px;box-shadow:0 24px 60px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,0.05);
}
.logo{
  width:54px;height:54px;border-radius:16px;background:var(--accent-grad);
  display:grid;place-items:center;margin:0 auto 18px;
  box-shadow:0 0 0 5px var(--accent-glow), 0 8px 24px rgba(37, 99, 235, 0.4);
}
.logo svg{width:28px;height:28px;stroke:var(--accent-ink);fill:none;stroke-width:2.2}
h1{
  font-family:'Plus Jakarta Sans','Kanit',sans-serif;font-size:1.35rem;font-weight:700;
  text-align:center;margin:0 0 4px;letter-spacing:-.015em;color:#fff;
}
.sub{text-align:center;color:var(--muted);font-size:.85rem;margin:0 0 28px}
label{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin:0 0 6px}
input{
  width:100%;font-family:inherit;font-size:.96rem;color:var(--ink);
  background:rgba(15, 23, 42, 0.6);border:1px solid rgba(255, 255, 255, 0.09);border-radius:12px;
  padding:12px 14px;margin-bottom:16px;
  transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
input:focus{outline:none;border-color:var(--accent);background:rgba(15, 23, 42, 0.9);box-shadow:0 0 0 3px var(--accent-glow)}
button{
  width:100%;appearance:none;border:1px solid rgba(255, 255, 255, 0.15);cursor:pointer;
  font-family:inherit;font-size:1rem;font-weight:600;
  background:var(--accent-grad);color:var(--accent-ink);
  padding:13px;border-radius:12px;margin-top:6px;
  box-shadow:0 4px 14px rgba(37, 99, 235, 0.35);
  transition:transform .12s ease, filter .18s ease, box-shadow .18s ease;
}
button:hover{filter:brightness(1.09);box-shadow:0 6px 20px rgba(37, 99, 235, 0.45)}
button:active{transform:scale(.98);box-shadow:none}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{
  min-height:20px;margin:14px 0 0;font-size:.85rem;text-align:center;color:var(--danger);
}
.foot{margin:22px 0 0;text-align:center;font-size:.74rem;color:var(--muted);line-height:1.6}
.spin{
  display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.15);
  border-top-color:var(--accent-2);border-radius:50%;
  animation:sp .7s linear infinite;vertical-align:-2px;
}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5v-13z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5v-13z"/></svg>
  </div>
  <h1>ร้านหนังสือมือสอง</h1>
  <p class="sub">ระบบสต็อก + ชั้นวาง + รับซื้อ</p>

  <label for="u">ชื่อผู้ใช้</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" required>

  <label for="p">รหัสผ่าน</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>

  <button type="submit" id="btn">เข้าสู่ระบบ</button>
  <p class="msg" id="msg" role="status"></p>
  <p class="foot">ระบบนี้จำกัดเฉพาะผู้ที่ได้รับอนุญาต<br>เพื่อป้องกันการใช้งานโดยบุคคลอื่น</p>
</form>

<script>
  const API = p => new URL('api/' + p, location.href.replace(/[^/]*$/, '')).toString();
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true;
    msg.style.color = '';
    msg.innerHTML = '<span class="spin"></span> กำลังตรวจสอบ...';
    try {
      const r = await fetch(API('login'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('u').value,
          password: document.getElementById('p').value
        })
      });
      const d = await r.json();
      if (d.ok) {
        msg.textContent = 'เข้าสู่ระบบสำเร็จ กำลังเปิดระบบ...';
        location.reload();
        return;
      }
      msg.textContent = d.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
    } catch (err) {
      msg.textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';
    }
    btn.disabled = false;
  });

  document.getElementById('u').focus();
</script>
</body>
</html>
